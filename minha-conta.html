<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ef">
  <title>Minha conta | L&A Moda e Acessórios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=site-font-size-plus-one-1">
  <script type="module" src="minha-conta.js"></script>
</head>
<body class="checkout-page registration-page">
  <header class="checkout-header">
    <a class="brand" href="index.html" aria-label="L&A Moda e Acessórios — início">
      <span class="brand-mark">L<span>&</span>A</span>
      <span class="brand-caption">MODA & ACESSÓRIOS</span>
    </a>
    <a class="checkout-back" href="index.html">← <span>Voltar à loja</span></a>
  </header>
  <main class="checkout-main registration-main">
    <p class="eyebrow">SEU ESPAÇO L&A</p>
    <h1>Minha conta</h1>
    <p class="checkout-intro" id="account-intro">Carregando seus dados…</p>
    <section class="checkout-section">
      <div class="checkout-section-heading">
        <span class="section-number">♡</span>
        <div><h2>Seus dados</h2><p>Informações básicas da sua conta.</p></div>
      </div>
      <div class="field-grid">
        <div class="form-field field-full"><label>Nome</label><p id="account-name">—</p></div>
        <div class="form-field field-full"><label>E-mail</label><p id="account-email">—</p></div>
        <div class="form-field field-full"><label>Cadastro</label><p id="account-created">—</p></div>
      </div>
    </section>
    <p class="checkout-feedback registration-feedback" id="account-feedback" role="status" aria-live="polite"></p>
    <button class="button checkout-submit" id="logout-button" type="button">Sair da minha conta <span aria-hidden="true">→</span></button>
  </main>
  <footer class="checkout-footer"><a href="index.html">L&A Moda e Acessórios</a><span>Seu espaço, do seu jeito.</span></footer>
</body>
</html>
